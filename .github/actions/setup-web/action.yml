name: Set up web toolchain
description: Install Node.js and the pnpm version from web/package.json, restore the pnpm store, and install web dependencies.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26"
        package-manager-cache: false

    - name: Install pinned pnpm
      id: pnpm
      shell: bash
      run: |
        set -euo pipefail
        package_manager="$(node -p 'require("./web/package.json").packageManager')"
        case "$package_manager" in
          pnpm@*) ;;
          *) echo "web/package.json must pin pnpm in packageManager" >&2; exit 1 ;;
        esac
        npm install --global "$package_manager"
        echo "store-path=$(pnpm --dir web store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store-path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package.json', 'web/pnpm-lock.yaml') }}

    - name: Install web dependencies
      shell: bash
      run: pnpm --dir web install --frozen-lockfile
