name: Set up Playwright
description: Restore or install the Playwright Chromium browser and its system dependencies.

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: version
      shell: bash
      run: echo "version=$(pnpm --dir web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install Chromium and system dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --dir web exec playwright install --with-deps chromium

    - name: Install system dependencies
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --dir web exec playwright install-deps chromium
