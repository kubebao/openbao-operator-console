name: Documentation feedback
description: Report a docs page that was confusing, missing, or incorrect
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the docs. Use this form for page quality problems, not product bugs or feature
        requests.

  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback type
      options:
        - Confusing explanation
        - Missing information
        - Incorrect information
        - Outdated information
        - Broken link
        - Typo or formatting problem
        - Other
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page
      description: Link or path of the page that needs work.
      placeholder: docs/installation.md
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What was confusing, missing, or incorrect?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested improvement
