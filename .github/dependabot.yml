version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-web
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /web
      - /tools/corepack
    schedule:
      interval: weekly
      day: wednesday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      compose-images:
        patterns:
          - "*"
