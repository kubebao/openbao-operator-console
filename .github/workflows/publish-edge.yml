name: Publish Edge

on:
  workflow_run:
    workflows: [Check, CodeQL]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  source:
    name: Select qualified main build
    if: >-
      github.repository == 'kubebao/openbao-operator-console' &&
      !github.event.repository.private &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/edge-source.py

  publish:
    name: Publish verified image, chart, and binaries
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      packages: write
      attestations: write
      id-token: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CANDIDATE: dist/edge-qualified
      GH_TOKEN: ${{ github.token }}
    steps:
      # Execute helper code from the trusted default-branch workflow, never from an artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edge-candidate
          path: ${{ runner.temp }}/upstream
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.run_id }}
      - name: Verify upstream CI provenance before unpacking
        run: |
          gh attestation verify "${RUNNER_TEMP}/upstream/edge-candidate.tar" --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/check.yml" \
            --source-ref refs/heads/main --source-digest "${SOURCE_SHA}"
      - name: Validate source, image configuration, and every artifact checksum
        env:
          BUILD_RUN_ID: ${{ needs.source.outputs.run_id }}
          BUILD_RUN_ATTEMPT: ${{ needs.source.outputs.run_attempt }}
        run: |
          python3 scripts/edge-bundle.py unpack "${CANDIDATE}" --bundle "${RUNNER_TEMP}/upstream/edge-candidate.tar" \
            --repository "${GITHUB_REPOSITORY}" --sha "${SOURCE_SHA}" \
            --run-id "${BUILD_RUN_ID}" --run-attempt "${BUILD_RUN_ATTEMPT}"
          {
            echo "VERSION=$(jq -er .version "${CANDIDATE}/metadata.json")"
            echo "IMAGE=$(jq -er .image.repository "${CANDIDATE}/metadata.json")"
            echo "DIGEST=$(jq -er .image.digest "${CANDIDATE}/metadata.json")"
          } >> "${GITHUB_ENV}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned registry tool
        run: |
          source scripts/edge-tools.env
          go install github.com/regclient/regclient/cmd/regctl@"${REGCTL_VERSION}"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to GHCR for Helm
        run: printf '%s' "${GH_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Publish the tested multi-platform image without rebuilding
        run: ./scripts/publish-edge.sh image "${CANDIDATE}"
      - name: Attest image publication provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Publish and pull-verify the packaged edge chart
        id: chart
        run: ./scripts/publish-edge.sh chart "${CANDIDATE}"
      - name: Attest chart publication provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts-edge/openbao-operator-console
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.57.1
      - name: Generate SBOMs from the published platform digests
        id: sbom
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            platform_digest="$(jq -er --arg platform "linux/${arch}" '.image.platforms[$platform]' "${CANDIDATE}/metadata.json")"
            "${SYFT}" scan "registry:${IMAGE}@${platform_digest}" \
              --output "spdx-json=${CANDIDATE}/openbao-operator-console-${VERSION}-linux-${arch}.spdx.json"
            echo "${arch}_digest=${platform_digest}" >> "${GITHUB_OUTPUT}"
          done
      - name: Attest SBOM (linux/amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.sbom.outputs.amd64_digest }}
          sbom-path: ${{ env.CANDIDATE }}/openbao-operator-console-${{ env.VERSION }}-linux-amd64.spdx.json
          push-to-registry: true
      - name: Attest SBOM (linux/arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.sbom.outputs.arm64_digest }}
          sbom-path: ${{ env.CANDIDATE }}/openbao-operator-console-${{ env.VERSION }}-linux-arm64.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.4
      - name: Sign and verify the image and chart
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-edge.yml@refs/heads/main"
          for subject in "${IMAGE}@${DIGEST}" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts-edge/openbao-operator-console@${CHART_DIGEST}"; do
            cosign sign --yes --new-bundle-format=true "${subject}"
            cosign verify --new-bundle-format=true --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${subject}"
            gh attestation verify "oci://${subject}" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/publish-edge.yml" \
              --source-ref refs/heads/main --source-digest "${SOURCE_SHA}"
          done
          for arch in amd64 arm64; do
            platform_digest="$(jq -er --arg platform "linux/${arch}" '.image.platforms[$platform]' "${CANDIDATE}/metadata.json")"
            gh attestation verify "oci://${IMAGE}@${platform_digest}" --repo "${GITHUB_REPOSITORY}" \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/publish-edge.yml" \
              --source-ref refs/heads/main --source-digest "${SOURCE_SHA}"
          done
      - name: Sign and verify release asset checksums
        run: |
          set -euo pipefail
          cd "${CANDIDATE}"
          sha256sum -- *.tar.gz *.tgz *.spdx.json LICENSE THIRD_PARTY_LICENSES metadata.json > checksums.txt
          cosign sign-blob --yes --new-bundle-format=true --bundle checksums.txt.sigstore.json checksums.txt
          cosign verify-blob --new-bundle-format=true --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-edge.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          sha256sum --check checksums.txt
          for archive in *.tar.gz *.tgz; do
            gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/check.yml" \
              --source-ref refs/heads/main --source-digest "${SOURCE_SHA}"
          done
      - name: Publish immutable prerelease downloads
        run: ./scripts/publish-edge.sh release "${CANDIDATE}"
      - name: Advance the moving edge image tag
        run: ./scripts/publish-edge.sh alias "${CANDIDATE}"
