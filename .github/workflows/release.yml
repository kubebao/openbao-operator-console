name: Release

# Publishes the image, chart, and release assets for an existing release tag. Release Please
# calls this workflow after it creates the tag and draft release. Run it manually to retry a
# failed publication. Tags created with the default token do not trigger workflows.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, such as 0.1.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, such as 0.1.0.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    if: >-
      github.repository == 'kubebao/openbao-operator-console' &&
      !github.event.repository.private &&
      vars.CONSOLE_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.vars.outputs.version }}
      image: ${{ steps.vars.outputs.image }}
      commit: ${{ steps.vars.outputs.commit }}
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must be a semantic version without a v prefix, such as 0.1.0" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Compute release variables
        id: vars
        env:
          TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          chart=charts/openbao-operator-console/Chart.yaml
          chart_version="$(sed -nE 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?.*$/\1/p' "${chart}")"
          app_version="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"#[:space:]]+)"?.*$/\1/p' "${chart}")"
          if [[ "${chart_version}" != "${TAG}" || "${app_version}" != "${TAG}" ]]; then
            echo "Chart.yaml version ${chart_version} and appVersion ${app_version} must match tag ${TAG}" >&2
            exit 1
          fi
          {
            echo "version=${TAG}"
            echo "image=ghcr.io/${OWNER,,}/openbao-operator-console"
            echo "commit=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

  image:
    name: Image
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=Read-only multi-cluster fleet console for the OpenBao Operator
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            index:org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Resolve platform digests
        id: sbom
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            platform_digest="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw |
              jq -er --arg arch "${arch}" \
                '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')"
            echo "${arch}_digest=${platform_digest}" >> "${GITHUB_OUTPUT}"
          done

      - name: Generate SBOM (linux/amd64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.sbom.outputs.amd64_digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          syft-version: v1.57.1
          format: spdx-json
          output-file: dist/openbao-operator-console-${{ env.VERSION }}-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generate SBOM (linux/arm64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.sbom.outputs.arm64_digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          syft-version: v1.57.1
          format: spdx-json
          output-file: dist/openbao-operator-console-${{ env.VERSION }}-linux-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Attest SBOM (linux/amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.sbom.outputs.amd64_digest }}
          sbom-path: dist/openbao-operator-console-${{ needs.prepare.outputs.version }}-linux-amd64.spdx.json
          push-to-registry: true

      - name: Attest SBOM (linux/arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.sbom.outputs.arm64_digest }}
          sbom-path: dist/openbao-operator-console-${{ needs.prepare.outputs.version }}-linux-arm64.spdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.4

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --new-bundle-format=true "${IMAGE}@${DIGEST}"

      - name: Verify image signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify --new-bundle-format=true \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\\.com/${REPOSITORY}/\\.github/workflows/release\\.yml@refs/" \
            "${IMAGE}@${DIGEST}" > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: dist/*.spdx.json
          retention-days: 7

  binaries:
    name: Binaries
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-web

      - name: Build archives
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: make dist VERSION="${VERSION}" COMMIT="${COMMIT}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/*.tar.gz
          retention-days: 7

  chart:
    name: Chart
    needs: [prepare, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      CHART_REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.0

      - name: Package chart
        run: |
          set -euo pipefail
          make helm-check
          helm package charts/openbao-operator-console --destination dist

      - name: Push chart
        id: push
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="${CHART_REPOSITORY,,}"
          printf '%s' "${REGISTRY_PASSWORD}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm push "dist/openbao-operator-console-${VERSION}.tgz" "oci://${repository}" 2>&1 | tee dist/push.log
          digest="$(sed -nE 's/^Digest:[[:space:]]*(sha256:[a-f0-9]{64}).*$/\1/p' dist/push.log)"
          if [[ -z "${digest}" ]]; then
            echo "helm push did not report a digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "chart=${repository}/openbao-operator-console" >> "${GITHUB_OUTPUT}"

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.chart }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign chart
        env:
          CHART: ${{ steps.push.outputs.chart }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --new-bundle-format=true "${CHART}@${DIGEST}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz
          retention-days: 7

  publish:
    name: Publish release assets
    needs: [prepare, image, chart, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.4

      - name: Write and sign checksums
        run: |
          set -euo pipefail
          cp THIRD_PARTY_LICENSES dist/
          cd dist
          sha256sum -- *.spdx.json *.tgz *.tar.gz THIRD_PARTY_LICENSES > checksums.txt
          cosign sign-blob --yes --new-bundle-format=true --bundle checksums.txt.sigstore.json checksums.txt

      - name: Upload assets and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber dist/*
          notes="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)"
          # A retry replaces the artifact section instead of appending a second one.
          notes="${notes%%$'\n\n## Artifacts'*}"
          # shellcheck disable=SC2016 # Backticks are Markdown code spans.
          printf '%s\n\n## Artifacts\n\n- Image: `%s:%s` (`%s`)\n- Chart: `oci://ghcr.io/%s/charts/openbao-operator-console --version %s`\n- Binaries: `openbao-operator-console_%s_<os>_<arch>.tar.gz` for Linux and macOS\n\nVerify signatures as described in [releasing](https://github.com/%s/blob/%s/docs/releasing.md#verify-a-release).\n' \
            "${notes}" "${IMAGE}" "${TAG}" "${DIGEST}" "${GITHUB_REPOSITORY_OWNER,,}" "${TAG}" "${TAG}" "${GITHUB_REPOSITORY}" "${TAG}" > "${RUNNER_TEMP}/notes.md"
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file "${RUNNER_TEMP}/notes.md" --draft=false
