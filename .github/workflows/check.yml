name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: console_test
          POSTGRES_USER: console
          POSTGRES_PASSWORD: console-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U console -d console_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      CONSOLE_TEST_DATABASE_URL: postgres://console:console-ci-only@127.0.0.1:5432/console_test?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
      - run: npm install -g pnpm@11.21.0
      - run: make install
      - run: make check-generated check integration build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: make e2e
