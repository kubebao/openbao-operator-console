name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make secret-scan

  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: console_test
          POSTGRES_USER: console
          POSTGRES_PASSWORD: console-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U console -d console_test"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      CONSOLE_TEST_DATABASE_URL: postgres://console:console-ci-only@127.0.0.1:5432/console_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: PostgreSQL backup tools
        env:
          CONSOLE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          scripts/test-postgres-tools.sh "$RUNNER_TEMP/postgres-tools"
          echo "$RUNNER_TEMP/postgres-tools" >> "$GITHUB_PATH"
          echo "CONSOLE_POSTGRES_CONTAINER=$CONSOLE_POSTGRES_CONTAINER" >> "$GITHUB_ENV"
      - name: Lint
        run: make lint
      - name: Unit and persistence integration tests
        run: go test -race -count=1 ./...
      - name: Fuzz authentication and proxy boundaries
        run: make fuzz FUZZ_TIME=10s
      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: |
            internal/auth/testdata/fuzz
            internal/clientip/testdata/fuzz
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - name: Type check
        run: pnpm --dir web typecheck
      - name: Lint
        run: pnpm --dir web lint
      - name: Format
        run: pnpm --dir web format:check
      - name: Unit tests
        run: pnpm --dir web test
      - name: Build
        run: pnpm --dir web build

  e2e:
    name: E2E (development)
    runs-on: ubuntu-24.04
    # Keep this version aligned with @playwright/test in web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-web
      - name: Build the development API
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/console ./cmd/console
      - name: Browser tests
        run: CONSOLE_E2E_PREBUILT=1 pnpm --dir web test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-development
          path: web/test-results
          retention-days: 7

  e2e-production:
    name: E2E (production)
    runs-on: ubuntu-24.04
    # Keep this version aligned with @playwright/test in web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-web
      - name: Browser tests against the compiled application
        run: |
          ./scripts/build.sh
          CONSOLE_E2E_PRODUCTION=1 pnpm --dir web test:e2e
          pnpm --dir web exec playwright test --config playwright.storage.config.ts
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-production
          path: web/test-results
          retention-days: 7

  generated:
    name: Generated code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-web
      - name: Check generated code
        run: make check-generated

  licenses:
    name: Third-party licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-web
      - name: Check THIRD_PARTY_LICENSES
        run: make check-licenses

  helm:
    name: Helm (${{ matrix.helm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.22.0, v4.3.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - name: Lint, render, and validate values
        run: make helm-check
      - name: Chart-testing lint
        env:
          CT_IMAGE: quay.io/helmpack/chart-testing:v3.15.0@sha256:54317f2d93730ea9ca1236e3d79cd95d74110b8d733b6ab124e5829209b5f4e4
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workdir" \
            --volume "$(command -v helm):/usr/local/bin/helm:ro" \
            --workdir /workdir \
            "$CT_IMAGE" ct lint --config .github/ct.yaml --all

  vulnerabilities:
    name: Go vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: make vulncheck

  audit:
    name: Web dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - name: Audit production dependencies
        run: make audit

  image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-web
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install pinned qualification tools
        run: |
          source scripts/edge-tools.env
          go install github.com/regclient/regclient/cmd/regctl@"${REGCTL_VERSION}"
          go install sigs.k8s.io/kind@"${KIND_VERSION}"
      - name: Compute candidate version
        id: candidate
        run: |
          mkdir -p "${RUNNER_TEMP}/edge-candidate"
          python3 scripts/edge-bundle.py identity "${RUNNER_TEMP}/edge-candidate" \
            --repository "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/edge-candidate/image.tar
          tags: console-candidate:${{ steps.candidate.outputs.version }}
          build-args: |
            VERSION=${{ steps.candidate.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=console-image
          cache-to: type=gha,mode=max,scope=console-image
      - name: Package and install the candidate chart and binaries
        run: ./scripts/edge-candidate.sh "${RUNNER_TEMP}/edge-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-candidate
          path: ${{ runner.temp }}/edge-candidate.tar
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

  release-tooling:
    name: Release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check-release-tools

  edge-evidence:
    name: Edge candidate provenance
    needs:
      [
        secrets,
        go,
        web,
        e2e,
        e2e-production,
        generated,
        licenses,
        helm,
        vulnerabilities,
        audit,
        image,
        release-tooling,
      ]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edge-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the qualified bundle
        run: |
          python3 scripts/edge-bundle.py unpack "${RUNNER_TEMP}/qualified" \
            --bundle "${RUNNER_TEMP}/candidate/edge-candidate.tar" \
            --repository "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
      - name: Attest the qualified bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/candidate/edge-candidate.tar
            ${{ runner.temp }}/qualified/*.tar.gz
            ${{ runner.temp }}/qualified/*.tgz
            ${{ runner.temp }}/qualified/metadata.json
