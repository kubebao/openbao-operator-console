services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: console_test
      POSTGRES_USER: console
      POSTGRES_PASSWORD: console-local-only
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - console-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console_test"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  console-postgres:
