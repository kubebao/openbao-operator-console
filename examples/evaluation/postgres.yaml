# Evaluation only: one PostgreSQL instance without TLS, backups, or high availability.
# scripts/evaluation.sh creates the console-postgres Secret with a random password.
# Use CloudNativePG or a managed database for anything you keep.
apiVersion: v1
kind: Service
metadata:
  name: console-postgres
  namespace: console-system
spec:
  selector:
    app.kubernetes.io/name: console-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: console-postgres
  namespace: console-system
spec:
  serviceName: console-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: console-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The postgres user of the Alpine image.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: console
            - name: POSTGRES_USER
              value: console
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: console-postgres
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "console", "-d", "console"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
