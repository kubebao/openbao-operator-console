# Isolated development identity provider. It does not configure system trust.
name: openbao-console-identity
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2-3@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    group_add: ["${KEYCLOAK_DEV_GROUP_ID:?Run scripts/keycloak-dev.py first}"]
    ports: ["127.0.0.1:8543:8443"]
    command:
      - start
      - --db=dev-file
      - --http-enabled=false
      - --hostname=https://localhost:8543
      - --https-certificate-file=/opt/keycloak/conf/server.crt
      - --https-certificate-key-file=/opt/keycloak/conf/server.key
      - --import-realm
    volumes:
      - ./.local/keycloak/server.crt:/opt/keycloak/conf/server.crt:ro
      - ./.local/keycloak/server.key:/opt/keycloak/conf/server.key:ro
      - ./.local/keycloak/realm.json:/opt/keycloak/data/import/console-dev.json:ro
