apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
{{- range .Values.readerNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-reader
  namespace: {{ . }}
rules:
  - apiGroups: ["openbao.org"]
    resources: ["openbaoclusters", "openbaorestores", "openbaorecoveries"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-reader
  namespace: {{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-reader
{{- end }}
{{- range .Values.operatorReaders }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-operator-reader
  namespace: {{ .namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: {{ toJson .deployments }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-operator-reader
  namespace: {{ .namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-operator-reader
{{- end }}
