{{- $secret := required "existingSecret is required" .Values.existingSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  # Sessions are local to this process. A restart requires a new login.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "console.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/enrollment: {{ toJson .Values.enrollment | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: {{ include "console.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=live
            - --listen=0.0.0.0:8090
            - --config=/etc/console/enrollment.yaml
            - --reader-name={{ include "console.serviceAccountName" . }}
            - --reader-namespace={{ .Release.Namespace }}
          ports:
            - name: http
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONSOLE_CONFIG_KEY_FILE
              value: /etc/console/key/config-key
            {{- if .Values.setup.tokenSecret }}
            - name: CONSOLE_SETUP_TOKEN_FILE
              value: /etc/console/setup/token
            {{- end }}
            {{- if .Values.bootstrapAdminSubjects }}
            - name: CONSOLE_BOOTSTRAP_ADMIN_SUBJECTS
              value: {{ join "," .Values.bootstrapAdminSubjects | quote }}
            {{- end }}
            {{- if .Values.historyRetention }}
            - name: CONSOLE_HISTORY_RETENTION
              value: {{ .Values.historyRetention | quote }}
            {{- end }}
            - name: CONSOLE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.urlSecret | default $secret }}
                  key: {{ required "database.urlKey is required" .Values.database.urlKey }}
            # libpq environment defaults. Parameters in the connection URL take precedence.
            {{- if .Values.database.sslMode }}
            - name: PGSSLMODE
              value: {{ .Values.database.sslMode | quote }}
            {{- end }}
            {{- if .Values.database.caSecret }}
            - name: PGSSLROOTCERT
              value: /etc/console/database/ca.crt
            {{- end }}
            - name: CONSOLE_OIDC_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: OIDC_REDIRECT_URL
            {{- range $key := list "OIDC_ISSUER" "OIDC_CLIENT_ID" "OIDC_CLIENT_SECRET" }}
            - name: CONSOLE_{{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- if .Values.oidcCA.configMap }}
            - name: CONSOLE_OIDC_CA_FILE
              value: /etc/console/oidc/ca.crt
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: configuration-key
              mountPath: /etc/console/key
              readOnly: true
            {{- if .Values.setup.tokenSecret }}
            - name: setup-token
              mountPath: /etc/console/setup
              readOnly: true
            {{- end }}
            - name: enrollment
              mountPath: /etc/console/enrollment.yaml
              subPath: enrollment.yaml
              readOnly: true
            {{- if .Values.oidcCA.configMap }}
            - name: oidc-ca
              mountPath: /etc/console/oidc
              readOnly: true
            {{- end }}
            {{- if .Values.database.caSecret }}
            - name: database-ca
              mountPath: /etc/console/database
              readOnly: true
            {{- end }}
            {{- range $i, $kubeconfig := .Values.kubeconfigSecrets }}
            - name: kubeconfig-{{ $i }}
              mountPath: {{ required "kubeconfigSecrets[].mountPath is required" $kubeconfig.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: configuration-key
          secret:
            secretName: {{ $secret }}
            defaultMode: 0440
            items:
              - key: CONFIG_KEY
                path: config-key
        - name: enrollment
          configMap:
            name: {{ include "console.fullname" . }}-enrollment
        {{- if .Values.setup.tokenSecret }}
        - name: setup-token
          secret:
            secretName: {{ .Values.setup.tokenSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.setup.tokenKey }}
                path: token
        {{- end }}
        {{- if .Values.oidcCA.configMap }}
        - name: oidc-ca
          configMap:
            name: {{ .Values.oidcCA.configMap }}
            items:
              - key: {{ .Values.oidcCA.key }}
                path: ca.crt
        {{- end }}
        {{- if .Values.database.caSecret }}
        - name: database-ca
          secret:
            secretName: {{ .Values.database.caSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.database.caKey }}
                path: ca.crt
        {{- end }}
        {{- range $i, $kubeconfig := .Values.kubeconfigSecrets }}
        - name: kubeconfig-{{ $i }}
          secret:
            secretName: {{ required "kubeconfigSecrets[].name is required" $kubeconfig.name }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
