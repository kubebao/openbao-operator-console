apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  # Sessions are local to this process. A restart requires a new login.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/enrollment: {{ toJson .Values.enrollment | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=live
            - --listen=0.0.0.0:8090
            - --config=/etc/console/enrollment.yaml
            - --reader-name={{ .Release.Name }}
            - --reader-namespace={{ .Release.Namespace }}
          ports:
            - name: http
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONSOLE_CONFIG_KEY_FILE
              value: /etc/console/key/config-key
            {{- if .Values.setup.tokenSecret }}
            - name: CONSOLE_SETUP_TOKEN_FILE
              value: /etc/console/setup/token
            {{- end }}
            {{- if .Values.bootstrapAdminSubjects }}
            - name: CONSOLE_BOOTSTRAP_ADMIN_SUBJECTS
              value: {{ join "," .Values.bootstrapAdminSubjects | quote }}
            {{- end }}
            {{- $secret := required "existingSecret is required" .Values.existingSecret }}
            {{- range $key := list "DATABASE_URL" "OIDC_REDIRECT_URL" }}
            - name: CONSOLE_{{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
            {{- end }}
            {{- range $key := list "OIDC_ISSUER" "OIDC_CLIENT_ID" "OIDC_CLIENT_SECRET" }}
            - name: CONSOLE_{{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- if .Values.oidcCA.configMap }}
            - name: CONSOLE_OIDC_CA_FILE
              value: /etc/console/oidc/ca.crt
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: configuration-key
              mountPath: /etc/console/key
              readOnly: true
            {{- if .Values.setup.tokenSecret }}
            - name: setup-token
              mountPath: /etc/console/setup
              readOnly: true
            {{- end }}
            - name: enrollment
              mountPath: /etc/console/enrollment.yaml
              subPath: enrollment.yaml
              readOnly: true
            {{- if .Values.oidcCA.configMap }}
            - name: oidc-ca
              mountPath: /etc/console/oidc
              readOnly: true
            {{- end }}
            {{- range $i, $secret := .Values.kubeconfigSecrets }}
            - name: kubeconfig-{{ $i }}
              mountPath: {{ $secret.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: configuration-key
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items:
              - key: CONFIG_KEY
                path: config-key
        - name: enrollment
          configMap:
            name: {{ .Release.Name }}-enrollment
        {{- if .Values.setup.tokenSecret }}
        - name: setup-token
          secret:
            secretName: {{ .Values.setup.tokenSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.setup.tokenKey }}
                path: token
        {{- end }}
        {{- if .Values.oidcCA.configMap }}
        - name: oidc-ca
          configMap:
            name: {{ .Values.oidcCA.configMap }}
            items:
              - key: {{ .Values.oidcCA.key }}
                path: ca.crt
        {{- end }}
        {{- range $i, $secret := .Values.kubeconfigSecrets }}
        - name: kubeconfig-{{ $i }}
          secret:
            secretName: {{ $secret.name }}
        {{- end }}
