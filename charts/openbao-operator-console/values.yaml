# Override the chart name used in resource names and labels.
nameOverride: ""
# Override the full resource name. Defaults to the release name, followed by the chart
# name unless the release name already contains it.
fullnameOverride: ""

image:
  repository: ghcr.io/kubebao/openbao-operator-console
  # Defaults to the chart appVersion.
  tag: ""
  # Optional image digest, such as sha256:<hex>. Takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

# Secrets for pulling the image from a private registry.
imagePullSecrets: []
# - name: registry-credentials

# Runtime Secret. Required keys:
#   CONFIG_KEY    32 random bytes, raw or encoded as hexadecimal or base64 text, for
#                 example from `openssl rand -hex 32`. Keep it across upgrades and back
#                 it up separately from PostgreSQL.
#   DATABASE_URL  PostgreSQL connection URL, unless database.urlSecret is set.
# Optional keys:
#   SETUP_TOKEN   Unlocks browser setup on an empty database. Remove it after setup.
#   OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET
#                 Seed the identity provider on the first start instead of browser setup.
existingSecret: ""

# Public HTTPS address of the console, such as https://console.example.com, without a
# path. The OIDC callback is this address followed by /auth/callback. Defaults to
# https://<ingress.host> when the Ingress is enabled.
publicURL: ""

# PostgreSQL connection. By default, the URL is read from existingSecret.
# Reference a Secret managed by the database provider so that the console reads
# its current value at each start. For CloudNativePG, use "<cluster>-app" and "uri".
# The console reads the URL and CA at startup; restart it after either changes.
database:
  urlSecret: ""
  urlKey: DATABASE_URL
  # Default TLS mode, exported as PGSSLMODE. An sslmode parameter in the URL takes
  # precedence. Set "" to use the driver default (prefer), which does not verify the server.
  sslMode: verify-full
  # Secret with the CA certificate that signed the server certificate, exported as
  # PGSSLROOTCERT. Without it, verification uses the image's system CA bundle.
  # An sslrootcert parameter in the URL takes precedence.
  caSecret: ""
  caKey: ca.crt

# How long observation history and activity are kept, as a Go duration from 1h to 8760h.
# Empty uses the console default of 168h (seven days).
historyRetention: ""

# Setup token for browser setup on an empty database without seeded SSO. The token is
# 32 random bytes encoded as hexadecimal or URL-safe base64 text, for example from
# `openssl rand -hex 32`. It is never generated or printed by the application or chart.
# The mount is optional; remove the key after setup.
setup:
  # Secret that holds the token. Defaults to existingSecret.
  tokenSecret: ""
  tokenKey: SETUP_TOKEN

# OIDC subjects granted administrator access during the first database import.
# Subsequent access changes use Settings in the console.
bootstrapAdminSubjects: []

# Optional ConfigMap containing the private CA for the OIDC provider.
# Trust applies only to OIDC; TLS verification remains enabled.
oidcCA:
  configMap: ""
  key: ca.crt

serviceAccount:
  # Create the ServiceAccount. When false, set name to an existing ServiceAccount.
  create: true
  # Defaults to the full resource name.
  name: ""
  annotations: {}

# The backend uses this ServiceAccount for connections without a kubeconfig.
# Grant list access only in enrolled namespaces on this Kubernetes cluster.
readerNamespaces: []

# Named controller Deployments on the local cluster. Separate from workload reads.
# Use one entry per operator namespace. Remote clusters use --print-rbac.
operatorReaders: []
# - namespace: openbao-operator-system
#   deployments: [openbao-operator-controller]

enrollment:
  maxBackupAgeHours: 24
  startupGraceMinutes: 10
  connections: []
  users: []
  groups: []
  relationships: []

# Mount pre-existing Secrets that contain remote kubeconfigs. Reference their
# mounted paths from enrollment.connections[].kubeconfig.
kubeconfigSecrets: []
# - name: remote-reader
#   mountPath: /etc/console/kubeconfigs/remote

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Serve HTTPS from the console itself with a kubernetes.io/tls Secret, for example when a
# load balancer or port-forward passes TLS through. Leave empty when an ingress or Gateway
# terminates TLS. The Service port then carries HTTPS.
tls:
  secretName: ""

service:
  type: ClusterIP
  port: 8090
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tlsSecret: ""

# Reverse proxies, such as the ingress controller Pods, whose X-Forwarded-For header
# identifies the client for sign-in rate limits and security logs. Use addresses or CIDR
# prefixes; prefixes that match every address are refused. Pair this with
# networkPolicy.ingressFrom, so that only these proxies can reach the console.
trustedProxies: []
# - 10.42.0.0/16

# Restrict traffic to the console Pod. Requires a CNI plugin that enforces NetworkPolicy.
networkPolicy:
  enabled: false
  # Sources allowed to reach the console port, as NetworkPolicy peers. An empty list
  # allows every source on the console port only.
  ingressFrom: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: ingress-nginx
  # Egress rules. An empty list leaves egress unrestricted. When set, allow DNS,
  # PostgreSQL, the identity provider, and every Kubernetes API server the console reads.
  egress: []
