                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "503": { "$ref": "#/components/responses/Unavailable" },
                },
            },
        },
      "/api/v1/settings/connections/credentials":
        {
          "get":
            {
              "operationId": "getCredentialStatuses",
              "responses":
                {
                  "200":
                    {
                      "description": "Administrator credential lifecycle status without authentication material",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/CredentialStatuses",
                                },
                            },
                        },
                    },
                  "401": { "$ref": "#/components/responses/Unauthenticated" },
                  "403": { "$ref": "#/components/responses/Forbidden" },
                  "503": { "$ref": "#/components/responses/Unavailable" },
                },
            },
        },
    },
  "components":
    {
      "securitySchemes":
        {
          "session":
            {
              "type": "apiKey",
              "in": "cookie",
              "name": "__Host-console-session",
              "description": "Signed-in console session, set by the OIDC callback or local sign-in. Demo mode accepts every request without it.",
            },
          "setupSession":
            {
              "type": "apiKey",
              "in": "cookie",
              "name": "__Host-console-setup",
              "description": "Short-lived setup session, set by unlockSetup after the setup token is accepted.",
            },
        },
      "parameters":
        {
          "Limit":
            {
              "name": "limit",
              "in": "query",
              "description": "Maximum number of items in the page.",
              "schema":
                {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 500,
                  "default": 100,
                },
            },
          "Cursor":
            {
              "name": "cursor",
              "in": "query",
              "description": "Opaque nextCursor of the previous page of the same list.",
              "schema": { "type": "string", "minLength": 1, "maxLength": 512 },
            },
        },
      "responses":
        {
          "BadRequest":
            {
              "description": "The request or one of its values is invalid. The detail names the problem.",
              "content":
                {
                  "application/problem+json":
                    { "schema": { "$ref": "#/components/schemas/Problem" } },
                },
            },
          "Unauthenticated":
            {
              "description": "The request has no valid session, or the setup token or setup session was not accepted.",
              "content":
                {
                  "application/problem+json":
                    { "schema": { "$ref": "#/components/schemas/Problem" } },
                },
            },
          "Forbidden":
            {
              "description": "The viewer is not a console administrator, or a state-changing request did not come from the console origin.",
              "content":
                {
                  "application/problem+json":
                    { "schema": { "$ref": "#/components/schemas/Problem" } },
                },
            },
          "NotFound":
            {
              "description": "The resource does not exist or is outside the viewer's scope. The two cases are indistinguishable.",
              "content":
                {
                  "application/problem+json":
                    { "schema": { "$ref": "#/components/schemas/Problem" } },
                },
            },
          "Conflict":
            {
              "description": "The settings revision changed, or console setup is already complete.",
              "content":
                {
                  "application/problem+json":
                    { "schema": { "$ref": "#/components/schemas/Problem" } },
                },
            },
          "Gone":
            {
              "description": "The setup window expired. Restart the console with a new setup token.",
              "content":
                {
                  "application/problem+json":
                    { "schema": { "$ref": "#/components/schemas/Problem" } },
                },
            },
          "TooManyRequests":
            {
              "description": "Too many setup attempts or open setup sessions.",
              "headers":
                {
                  "Retry-After":
                    {
                      "description": "Seconds to wait before retrying.",
                      "schema": { "type": "integer" },
                    },
                },
              "content":
                {
                  "application/problem+json":
                    { "schema": { "$ref": "#/components/schemas/Problem" } },
                },
            },
          "Unavailable":
            {
              "description": "The database or a dependency is unavailable, or console setup must complete first. Retry later.",
              "content":
                {
                  "application/problem+json":
                    { "schema": { "$ref": "#/components/schemas/Problem" } },
                },
            },
        },
      "schemas":
        {
          "Evidence":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "collection",
                  "collectedAt",
                  "lastAttemptAt",
                  "producerObservedAt",
                  "producerFreshness",
                ],
              "properties":
                {
                  "collection":
                    {
                      "type": "string",
                      "enum":
                        [
                          "current",
                          "stale",
                          "denied",
                          "unreachable",
                          "unsupported",
                        ],
                    },
                  "collectedAt": { "type": "string", "format": "date-time" },
                  "lastAttemptAt": { "type": "string", "format": "date-time" },
                  "producerObservedAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "producerFreshness":
                    { "type": "string", "enum": ["unknown", "fresh", "stale"] },
                },
            },
          "Condition":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "type",
                  "status",
                  "reason",
                  "message",
                  "observedGeneration",
                  "lastTransitionAt",
                ],
              "properties":
                {
                  "type": { "type": "string" },
                  "status":
                    { "type": "string", "enum": ["True", "False", "Unknown"] },
                  "reason": { "type": "string" },
                  "message": { "type": "string" },
                  "observedGeneration":
                    { "type": "integer", "format": "int64" },
                  "lastTransitionAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                },
            },
          "RestoreTest":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "outcome",
                  "finishedAt",
                  "lastSuccessAt",
                  "key",
                  "digest",
                  "reason",
                ],
              "properties":
                {
                  "outcome":
                    {
                      "type": "string",
                      "enum":
                        ["notRun", "running", "passed", "failed", "blocked"],
                    },
                  "finishedAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "lastSuccessAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "key": { "type": "string", "nullable": true },
                  "digest": { "type": "string", "nullable": true },
                  "reason": { "type": "string" },
                },
            },
          "Backup":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "lastSuccessAt",
                  "nextAt",
                  "key",
                  "digest",
                  "sizeBytes",
                  "consecutiveFailures",
                  "restoreTest",
                ],
              "properties":
                {
                  "lastSuccessAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "nextAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "key": { "type": "string", "nullable": true },
                  "digest": { "type": "string", "nullable": true },
                  "sizeBytes":
                    { "type": "integer", "format": "int64", "nullable": true },
                  "consecutiveFailures":
                    { "type": "integer", "format": "int32" },
                  "restoreTest":
                    {
                      "nullable": true,
                      "allOf": [{ "$ref": "#/components/schemas/RestoreTest" }],
                    },
                },
            },
          "Recovery":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "requestName",
                  "mechanism",
                  "phase",
                  "stage",
                  "startedAt",
                  "completedAt",
                  "applicationConfirmedAt",
                  "cleanup",
                  "exclusionAcknowledged",
                ],
              "properties":
                {
                  "requestName": { "type": "string" },
                  "mechanism":
                    { "type": "string", "enum": ["snapshot", "native"] },
                  "phase":
                    {
                      "type": "string",
                      "enum":
                        [
                          "pending",
                          "validating",
                          "running",
                          "completed",
                          "failed",
                          "unknown",
                        ],
                    },
                  "stage": { "type": "string" },
                  "startedAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "completedAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "applicationConfirmedAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "cleanup":
                    {
                      "type": "string",
                      "enum":
                        ["notApplicable", "pending", "complete", "failed"],
                    },
                  "exclusionAcknowledged":
                    { "type": "boolean", "nullable": true },
                },
            },
          "Replica":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                ["observedAt", "localIndex", "sourceIndex", "historyConflict"],
              "properties":
                {
                  "observedAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "localIndex": { "type": "string", "nullable": true },
                  "sourceIndex": { "type": "string", "nullable": true },
                  "historyConflict": { "type": "boolean" },
                },
            },
          "Issue":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "id",
                  "deploymentId",
                  "rule",
                  "severity",
                  "category",
                  "title",
                  "detail",
                  "firstSeenAt",
                  "lastCheckedAt",
                ],
              "properties":
                {
                  "id": { "type": "string" },
                  "deploymentId": { "type": "string" },
                  "rule": { "type": "string" },
                  "severity":
                    { "type": "string", "enum": ["critical", "high", "info"] },
                  "category":
                    {
                      "type": "string",
                      "enum":
                        ["availability", "operations", "backup", "visibility"],
                    },
                  "title": { "type": "string" },
                  "detail": { "type": "string" },
                  "firstSeenAt": { "type": "string", "format": "date-time" },
                  "lastCheckedAt": { "type": "string", "format": "date-time" },
                },
            },
          "Deployment":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "id",
                  "uid",
                  "name",
                  "namespace",
                  "connectionId",
                  "location",
                  "team",
                  "environment",
                  "version",
                  "desiredVersion",
                  "operatorVersion",
                  "role",
                  "health",
                  "readyReplicas",
                  "desiredReplicas",
                  "evidence",
                  "conditions",
                  "backup",
                  "recovery",
                  "replica",
                  "issues",
                  "resourceVersion",
                  "generation",
                  "upgradeFailure",
                  "operatorId",
                ],
              "properties":
                {
                  "id": { "type": "string" },
                  "uid": { "type": "string" },
                  "name": { "type": "string" },
                  "namespace": { "type": "string" },
                  "connectionId": { "type": "string" },
                  "location": { "type": "string" },
                  "team": { "type": "string" },
                  "environment":
                    {
                      "type": "string",
                      "enum": ["production", "staging", "development", "other"],
                    },
                  "version": { "type": "string" },
                  "desiredVersion": { "type": "string" },
                  "operatorVersion": { "type": "string", "nullable": true },
                  "role":
                    {
                      "type": "string",
                      "enum": ["primary", "replica", "recoveryTarget"],
                    },
                  "health":
                    {
                      "type": "string",
                      "enum": ["healthy", "attention", "critical", "unknown"],
                    },
                  "readyReplicas":
                    { "type": "integer", "format": "int32", "nullable": true },
                  "desiredReplicas":
                    { "type": "integer", "format": "int32", "nullable": true },
                  "evidence": { "$ref": "#/components/schemas/Evidence" },
                  "conditions":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/Condition" },
                    },
                  "backup":
                    {
                      "nullable": true,
                      "allOf": [{ "$ref": "#/components/schemas/Backup" }],
                    },
                  "recovery":
                    {
                      "nullable": true,
                      "allOf": [{ "$ref": "#/components/schemas/Recovery" }],
                    },
                  "replica":
                    {
                      "nullable": true,
                      "allOf": [{ "$ref": "#/components/schemas/Replica" }],
                    },
                  "issues":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/Issue" },
                    },
                  "resourceVersion": { "type": "string" },
                  "generation": { "type": "integer", "format": "int64" },
                  "upgradeFailure":
                    {
                      "allOf":
                        [{ "$ref": "#/components/schemas/OperationFailure" }],
                      "nullable": true,
                    },
                  "operatorId": { "type": "string", "nullable": true },
                },
            },
          "Connection":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "id",
                  "name",
                  "region",
                  "collection",
                  "lastSuccessAt",
                  "lastAttemptAt",
                  "namespaces",
                  "operators",
                  "capabilities",
                ],
              "properties":
                {
                  "id": { "type": "string" },
                  "name": { "type": "string" },
                  "region": { "type": "string" },
                  "collection":
                    {
                      "type": "string",
                      "enum":
                        [
                          "current",
                          "stale",
                          "denied",
                          "unreachable",
                          "unsupported",
                          "pending",
                        ],
                    },
                  "lastSuccessAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "lastAttemptAt": { "type": "string", "format": "date-time" },
                  "namespaces":
                    { "type": "array", "items": { "type": "string" } },
                  "operators":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/Operator" },
                    },
                  "capabilities":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/ApiCapability" },
                    },
                },
            },
          "Relationship":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "id",
                  "sourceId",
                  "targetId",
                  "kind",
                  "repository",
                  "provenance",
                  "observedAt",
                ],
              "properties":
                {
                  "id": { "type": "string" },
                  "sourceId": { "type": "string" },
                  "targetId": { "type": "string" },
                  "kind":
                    {
                      "type": "string",
                      "enum": ["replication", "snapshotRecovery"],
                    },
                  "repository": { "type": "string", "nullable": true },
                  "provenance":
                    {
                      "type": "string",
                      "enum": ["declared", "observed", "historical"],
                    },
                  "observedAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                },
            },
          "Activity":
            {
              "type": "object",
              "additionalProperties": false,
              "description": "One observed state transition of a deployment. The change object matching kind is set and the others are null. Legacy events have no structured change details and all change objects are null. Clients render the text.",
              "required":
                [
                  "id",
                  "deploymentId",
                  "deploymentName",
                  "connectionId",
                  "namespace",
                  "recordedAt",
                  "kind",
                  "health",
                  "collection",
                  "finding",
                ],
              "properties":
                {
                  "id": { "type": "string" },
                  "deploymentId": { "type": "string" },
                  "deploymentName":
                    {
                      "type": "string",
                      "description": "The resource name when the change was recorded, or empty for an older record without a retained name. The deployment may since have been deleted.",
                    },
                  "connectionId": { "type": "string" },
                  "namespace": { "type": "string" },
                  "recordedAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "description": "The collection attempt that observed the change. The transition happened between the previous attempt and this time.",
                    },
                  "kind":
                    {
                      "type": "string",
                      "enum":
                        [
                          "healthChanged",
                          "collectionChanged",
                          "findingRaised",
                          "findingResolved",
                          "findingSeverityChanged",
                          "legacy",
                        ],
                    },
                  "health":
                    {
                      "nullable": true,
                      "allOf":
                        [{ "$ref": "#/components/schemas/HealthChange" }],
                    },
                  "collection":
                    {
                      "nullable": true,
                      "allOf":
                        [{ "$ref": "#/components/schemas/CollectionChange" }],
                    },
                  "finding":
                    {
                      "nullable": true,
                      "allOf":
                        [{ "$ref": "#/components/schemas/FindingChange" }],
                    },
                },
            },
          "HealthChange":
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["from", "to"],
              "properties":
                {
                  "from":
                    {
                      "type": "string",
                      "enum": ["healthy", "attention", "critical", "unknown"],
                    },
                  "to":
                    {
                      "type": "string",
                      "enum": ["healthy", "attention", "critical", "unknown"],
                    },
                },
            },
          "CollectionChange":
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["from", "to"],
              "properties":
                {
                  "from":
                    {
                      "type": "string",
                      "enum":
                        [
                          "current",
                          "stale",
                          "denied",
                          "unreachable",
                          "unsupported",
                        ],
                    },
                  "to":
                    {
                      "type": "string",
                      "enum":
                        [
                          "current",
                          "stale",
                          "denied",
                          "unreachable",
                          "unsupported",
                        ],
                    },
                },
            },
          "FindingChange":
            {
              "type": "object",
              "additionalProperties": false,
              "description": "A finding identified by its rule. severity is the current severity, or the last severity of a resolved finding. previousSeverity is set only for findingSeverityChanged.",
              "required": ["rule", "severity", "previousSeverity"],
              "properties":
                {
                  "rule":
                    {
                      "type": "string",
                      "enum":
                        [
                          "replica-readiness",
                          "sealed",
                          "upgrade-failed",
                          "backup-failed",
                          "backup-never-succeeded",
                          "backup-overdue",
                          "restore-test",
                          "replica-history-conflict",
                          "recovery-investigate",
                          "collection",
                        ],
                    },
                  "severity":
                    { "type": "string", "enum": ["critical", "high", "info"] },
                  "previousSeverity":
                    {
                      "type": "string",
                      "enum": ["critical", "high", "info"],
                      "nullable": true,
                    },
                },
            },
          "Viewer":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                ["name", "subject", "connectionIds", "admin", "localAccount"],
              "properties":
                {
                  "localAccount":
                    {
                      "type": "boolean",
                      "description": "The viewer signed in with a local account.",
                    },
                  "name": { "type": "string" },
                  "subject": { "type": "string" },
                  "connectionIds":
                    { "type": "array", "items": { "type": "string" } },
                  "admin": { "type": "boolean" },
                },
            },
          "Snapshot":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "mode",
                  "generatedAt",
                  "build",
                  "deployments",
                  "connections",
                  "relationships",
                  "viewer",
                  "policy",
                ],
              "properties":
                {
                  "mode": { "type": "string", "enum": ["demo", "live"] },
                  "build": { "$ref": "#/components/schemas/BuildInfo" },
                  "generatedAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "description": "When the console read this snapshot from its database. It is not a collection time: each connection, operator, and deployment reports its own collection and producer times.",
                    },
                  "deployments":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/Deployment" },
                    },
                  "connections":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/Connection" },
                    },
                  "relationships":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/Relationship" },
                    },
                  "viewer": { "$ref": "#/components/schemas/Viewer" },
                  "policy": { "$ref": "#/components/schemas/AttentionPolicy" },
                },
            },
          "BuildInfo":
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["version", "commit"],
              "properties":
                {
                  "version":
                    {
                      "type": "string",
                      "description": "Console build version, or dev for an unversioned build.",
                    },
                  "commit":
                    {
                      "type": "string",
                      "description": "Console source revision when available; empty when unknown.",
                    },
                },
            },
          "AttentionPolicy":
            {
              "type": "object",
              "additionalProperties": false,
              "description": "Thresholds the attention rules apply to every deployment.",
              "required": ["maxBackupAgeHours", "startupGraceMinutes"],
              "properties":
                {
                  "maxBackupAgeHours": { "type": "integer", "minimum": 1 },
                  "startupGraceMinutes": { "type": "integer", "minimum": 0 },
                },
            },
          "ActivityPage":
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["events", "nextCursor"],
              "properties":
                {
                  "events":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/Activity" },
                    },
                  "nextCursor":
                    {
                      "type": "string",
                      "nullable": true,
                      "description": "Pass as cursor to read the next, older page. Null on the last page.",
                    },
                },
            },
          "History":
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["observations", "baseline", "nextCursor"],
              "properties":
                {
                  "observations":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/Observation" },
                    },
                  "baseline":
                    {
                      "nullable": true,
                      "description": "The newest observation recorded before since: the state at the start of the window. Set only on the first page of a request with since.",
                      "allOf": [{ "$ref": "#/components/schemas/Observation" }],
                    },
                  "nextCursor":
                    {
                      "type": "string",
                      "nullable": true,
                      "description": "Pass as cursor to read the next, older page. Null on the last page.",
                    },
                },
            },
          "Problem":
            {
              "type": "object",
              "additionalProperties": false,
              "description": "RFC 9457 problem details, served as application/problem+json. Clients branch on code. The detail is safe to show to the requester.",
              "required": ["type", "title", "status", "detail", "code"],
              "properties":
                {
                  "type":
                    {
                      "type": "string",
                      "enum": ["about:blank"],
                      "description": "The console defines no problem type URIs. The title is the HTTP status phrase.",
                    },
                  "title": { "type": "string" },
                  "status":
                    { "type": "integer", "minimum": 400, "maximum": 599 },
                  "detail": { "type": "string" },
                  "code": { "$ref": "#/components/schemas/ProblemCode" },
                },
            },
          "ProblemCode":
            {
              "type": "string",
              "description": "Machine-readable failure reason. Every value the server emits is listed.",
              "enum":
                [
                  "invalid",
                  "unauthenticated",
                  "invalid_token",
                  "setup_locked",
                  "forbidden",
                  "not_found",
                  "conflict",
                  "setup_complete",
                  "setup_expired",
                  "rate_limited",
                  "unavailable",
                  "setup_required",
                ],
            },
          "Observation":
            {
              "type": "object",
