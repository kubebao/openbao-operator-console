                  "connectionId": { "type": "string" },
                  "mode":
                    {
                      "type": "string",
                      "enum": ["local", "manual", "automatic"],
                    },
                  "state":
                    {
                      "type": "string",
                      "enum":
                        [
                          "ready",
                          "pending",
                          "healthy",
                          "retrying",
                          "permissionDenied",
                          "reconnectRequired",
                          "paused",
                        ],
                    },
                  "expiresAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "expirySource":
                    {
                      "type": "string",
                      "enum":
                        [
                          "unknown",
                          "declaredToken",
                          "certificate",
                          "tokenRequest",
                        ],
                    },
                  "lastAttemptAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "lastSuccessAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "nextAttemptAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                },
            },
          "CredentialStatuses":
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["credentials"],
              "properties":
                {
                  "credentials":
                    {
                      "type": "array",
                      "items":
                        { "$ref": "#/components/schemas/CredentialStatus" },
                    },
                },
            },
        },
    },
}
