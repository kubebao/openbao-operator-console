  "components":
    {
      "schemas":
        {
          "Evidence":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "collection",
                  "collectedAt",
                  "lastAttemptAt",
                  "producerObservedAt",
                  "producerFreshness",
                ],
              "properties":
                {
                  "collection":
                    {
                      "type": "string",
                      "enum":
                        [
                          "current",
                          "stale",
                          "denied",
                          "unreachable",
                          "unsupported",
                        ],
                    },
                  "collectedAt": { "type": "string", "format": "date-time" },
                  "lastAttemptAt": { "type": "string", "format": "date-time" },
                  "producerObservedAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "producerFreshness":
                    { "type": "string", "enum": ["unknown", "fresh", "stale"] },
                },
            },
          "Condition":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "type",
                  "status",
                  "reason",
                  "message",
                  "observedGeneration",
                  "lastTransitionAt",
                ],
              "properties":
                {
                  "type": { "type": "string" },
                  "status":
                    { "type": "string", "enum": ["True", "False", "Unknown"] },
                  "reason": { "type": "string" },
                  "message": { "type": "string" },
                  "observedGeneration":
                    { "type": "integer", "format": "int64" },
                  "lastTransitionAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                },
            },
          "RestoreTest":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "outcome",
                  "finishedAt",
                  "lastSuccessAt",
                  "key",
                  "digest",
                  "reason",
                ],
              "properties":
                {
                  "outcome":
                    {
                      "type": "string",
                      "enum":
                        ["notRun", "running", "passed", "failed", "blocked"],
                    },
                  "finishedAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "lastSuccessAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "key": { "type": "string", "nullable": true },
                  "digest": { "type": "string", "nullable": true },
                  "reason": { "type": "string" },
                },
            },
          "Backup":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "lastSuccessAt",
                  "nextAt",
                  "key",
                  "digest",
                  "sizeBytes",
                  "consecutiveFailures",
                  "restoreTest",
                ],
              "properties":
                {
                  "lastSuccessAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "nextAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "key": { "type": "string", "nullable": true },
                  "digest": { "type": "string", "nullable": true },
                  "sizeBytes":
                    { "type": "integer", "format": "int64", "nullable": true },
                  "consecutiveFailures":
                    { "type": "integer", "format": "int32" },
                  "restoreTest":
                    {
                      "nullable": true,
                      "allOf": [{ "$ref": "#/components/schemas/RestoreTest" }],
                    },
                },
