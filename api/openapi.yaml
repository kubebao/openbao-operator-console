            },
          "ReaderAccessInput":
            {
              "type": "object",
              "required": ["connection"],
              "properties":
                {
                  "connection":
                    { "$ref": "#/components/schemas/ManagedConnection" },
                },
              "additionalProperties": false,
            },
          "ReaderAccessResult":
            {
              "type": "object",
              "required": ["rbac", "serviceAccount", "serviceAccountNamespace"],
              "properties":
                {
                  "rbac": { "type": "string" },
                  "serviceAccount": { "type": "string" },
                  "serviceAccountNamespace": { "type": "string" },
                },
              "additionalProperties": false,
            },
          "ConnectionDiagnostic":
            {
              "type": "object",
              "required": ["state", "message"],
              "properties":
                {
                  "state":
                    {
                      "type": "string",
                      "enum":
                        [
                          "available",
                          "unreachable",
                          "tlsError",
                          "unauthorized",
                          "forbidden",
                          "unsupported",
                          "unknown",
                        ],
                    },
                  "message": { "type": "string" },
                },
              "additionalProperties": false,
            },
          "CredentialExpiry":
            {
              "type": "object",
              "required": ["expiresAt", "source"],
              "properties":
                {
                  "expiresAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "source":
                    {
                      "type": "string",
                      "enum": ["certificate", "declaredToken", "unknown"],
                    },
                },
              "additionalProperties": false,
            },
          "TokenRenewal":
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["namespace", "serviceAccount"],
              "properties":
                {
                  "namespace":
                    { "type": "string", "minLength": 1, "maxLength": 63 },
                  "serviceAccount":
                    { "type": "string", "minLength": 1, "maxLength": 253 },
                },
            },
          "CredentialStatus":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "connectionId",
                  "mode",
                  "state",
                  "expiresAt",
                  "expirySource",
                  "lastAttemptAt",
                  "lastSuccessAt",
                  "nextAttemptAt",
                ],
              "properties":
                {
                  "connectionId": { "type": "string" },
                  "mode":
                    {
                      "type": "string",
                      "enum": ["local", "manual", "automatic"],
                    },
                  "state":
                    {
                      "type": "string",
                      "enum":
                        [
                          "ready",
                          "pending",
                          "healthy",
                          "retrying",
                          "permissionDenied",
                          "reconnectRequired",
                          "paused",
                        ],
                    },
                  "expiresAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "expirySource":
                    {
                      "type": "string",
                      "enum":
                        [
                          "unknown",
                          "declaredToken",
                          "certificate",
                          "tokenRequest",
                        ],
                    },
                  "lastAttemptAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "lastSuccessAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                  "nextAttemptAt":
                    {
                      "type": "string",
                      "format": "date-time",
                      "nullable": true,
                    },
                },
            },
          "CredentialStatuses":
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["credentials"],
              "properties":
                {
                  "credentials":
                    {
                      "type": "array",
                      "items":
                        { "$ref": "#/components/schemas/CredentialStatus" },
                    },
                },
            },
        },
    },
}
